<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feed skeleton loading — before</title>
  <style>
    :root {
      --surface-warm: #FFFBF5;
      --surface-card: #FFFFFF;
      --surface-subtle: #F4ECDF;
      --ink-lead: #1F1B18;
      --ink-muted: #5E534B;
      --brand-primary: #4D9463;
      --shadow-lift: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, system-ui, Nunito, sans-serif; background: var(--surface-warm); color: var(--ink-lead); min-height: 100vh; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: var(--surface-card); box-shadow: var(--shadow-lift); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-mark { width: 28px; height: 28px; border-radius: 9999px; background: var(--surface-subtle); box-shadow: inset 0 0 0 3px var(--brand-primary); position: relative; }
    .brand-mark::after { content: ""; position: absolute; inset: 7px; border-radius: 9999px; background: #F0B24F; opacity: 0.9; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: 240px minmax(0,1fr) 240px; gap: 24px; }
    .card { background: var(--surface-card); border-radius: 16px; box-shadow: var(--shadow-lift); }
    .family-card { overflow: hidden; }
    .family-banner { height: 56px; background: rgba(77,148,99,0.15); }
    .family-body { display: flex; flex-direction: column; align-items: center; padding: 0 16px 20px; margin-top: -28px; text-align: center; }
    .family-avatar { width: 56px; height: 56px; border-radius: 9999px; border: 4px solid var(--surface-card); background: var(--surface-warm); display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--brand-primary); }
    .family-name { margin-top: 8px; font-weight: 600; }
    .family-meta { margin-top: 2px; font-size: 12px; color: var(--ink-muted); }
    .pill-btn { margin-top: 12px; width: 100%; border-radius: 9999px; border: 1px solid rgba(94,83,75,0.3); padding: 6px 12px; font-size: 14px; font-weight: 500; background: transparent; text-align: center; }
    .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .composer { padding: 16px; }
    .composer-placeholder { height: 72px; font-style: italic; color: var(--ink-muted); font-size: 15px; }
    .composer-row { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .tool-chip { height: 32px; width: 72px; border-radius: 9999px; background: var(--surface-warm); border: 1px solid rgba(94,83,75,0.15); }
    .post-btn { height: 36px; padding: 0 16px; border-radius: 9999px; background: #3F7E54; color: white; font-weight: 600; font-size: 14px; display: grid; place-items: center; box-shadow: var(--shadow-lift); border: 0; }
    .loading { color: var(--ink-muted); font-size: 15px; }
    .community { padding: 16px; }
    .community h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; }
    .view-all { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--brand-primary); }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand"><div class="brand-mark"></div>fofafu</div>
    <div></div><div></div>
  </header>
  <main>
    <div class="grid">
      <aside>
        <section class="card family-card">
          <div class="family-banner"></div>
          <div class="family-body">
            <div class="family-avatar">J</div>
            <div class="family-name">Jordan Lee</div>
            <div class="family-meta">Portland, OR</div>
            <div class="pill-btn">Edit family page</div>
          </div>
        </section>
      </aside>
      <section class="stack" aria-label="Announcements">
        <form class="card composer">
          <div class="composer-placeholder">What’s going on at home?</div>
          <div class="composer-row"><div class="tool-chip"></div><button class="post-btn" type="button">Post</button></div>
        </form>
        <div class="card p-5">
          <p class="loading">Loading…</p>
        </div>
      </section>
      <aside>
        <section class="card community">
          <h2>Community</h2>
          <p class="loading">Loading…</p>
          <div class="view-all">View all →</div>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
