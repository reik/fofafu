<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home feed skeleton — proposal mock</title>
  <style>
    :root {
      --surface-warm: #FFFBF5;
      --surface-card: #FFFFFF;
      --surface-subtle: #F4ECDF;
      --ink-lead: #1F1B18;
      --ink-muted: #5E534B;
      --brand-primary: #4D9463;
      --brand-primary-pressed: #3F7E54;
      --brand-warm: #F0B24F;
      --shadow-lift: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, Nunito, sans-serif;
      background: var(--surface-warm);
      color: var(--ink-lead);
      min-height: 100vh;
    }

    /* subtle shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .bone {
      background: linear-gradient(
        90deg,
        var(--surface-subtle) 0%,
        #ebe1d2 45%,
        var(--surface-subtle) 90%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 8px;
    }
    .bone-round { border-radius: 9999px; }

    /* chrome */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: var(--surface-card);
      box-shadow: var(--shadow-lift);
      border-bottom: 1px solid rgba(31, 27, 24, 0.04);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 9999px;
      background: var(--surface-subtle);
      box-shadow: inset 0 0 0 3px var(--brand-primary);
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 9999px;
      background: var(--brand-warm);
      opacity: 0.9;
    }
    .nav-track {
      display: flex;
      gap: 2px;
      padding: 4px;
      border-radius: 9999px;
      background: var(--surface-warm);
    }
    .nav-item {
      width: 44px; height: 44px;
      border-radius: 9999px;
      display: grid; place-items: center;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 600;
    }
    .nav-item.active {
      background: var(--brand-primary-pressed);
      color: white;
    }
    .nav-right {
      display: flex; align-items: center; gap: 12px;
    }
    .avatar-chip {
      width: 36px; height: 36px; border-radius: 9999px;
      background: var(--surface-subtle);
      display: grid; place-items: center;
      font-weight: 700; color: var(--brand-primary);
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 240px;
      gap: 24px;
    }

    .card {
      background: var(--surface-card);
      border-radius: 16px;
      box-shadow: var(--shadow-lift);
    }

    /* left rail */
    .family-card { overflow: hidden; }
    .family-banner { height: 56px; background: rgba(77, 148, 99, 0.15); }
    .family-body {
      display: flex; flex-direction: column; align-items: center;
      padding: 0 16px 20px; margin-top: -28px; text-align: center;
    }
    .family-avatar {
      width: 56px; height: 56px; border-radius: 9999px;
      border: 4px solid var(--surface-card);
      background: var(--surface-warm);
      display: grid; place-items: center;
      font-weight: 700; font-size: 22px; color: var(--brand-primary);
    }
    .family-name { margin-top: 8px; font-weight: 600; }
    .family-meta { margin-top: 2px; font-size: 12px; color: var(--ink-muted); }
    .pill-btn {
      margin-top: 12px; width: 100%;
      border-radius: 9999px;
      border: 1px solid rgba(94, 83, 75, 0.3);
      padding: 6px 12px;
      font-size: 14px; font-weight: 500;
      background: transparent; color: var(--ink-lead);
      text-align: center;
    }

    /* center */
    .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    .composer { padding: 16px; }
    .composer-placeholder {
      height: 72px;
      color: var(--ink-muted);
      font-style: italic;
      font-size: 15px;
      padding-top: 4px;
    }
    .composer-row {
      margin-top: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .composer-tools { display: flex; gap: 8px; }
    .tool-chip {
      height: 32px; width: 72px; border-radius: 9999px;
      background: var(--surface-warm);
      border: 1px solid rgba(94, 83, 75, 0.15);
    }
    .post-btn {
      height: 36px; padding: 0 16px;
      border-radius: 9999px;
      background: var(--brand-primary-pressed);
      color: white; font-weight: 600; font-size: 14px;
      display: grid; place-items: center;
      box-shadow: var(--shadow-lift);
      border: 0;
    }

    /* skeleton card mirrors AnnouncementCard */
    .skel-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .skel-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .skel-author { display: flex; align-items: center; gap: 8px; }
    .skel-avatar { width: 32px; height: 32px; border-radius: 9999px; }
    .skel-meta { display: flex; flex-direction: column; gap: 6px; }
    .skel-name { height: 12px; width: 96px; }
    .skel-time { height: 8px; width: 56px; }
    .skel-open { height: 12px; width: 44px; }

    .skel-lines { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
    .skel-line { height: 12px; }
    .skel-line.w100 { width: 100%; }
    .skel-line.w92 { width: 92%; }
    .skel-line.w78 { width: 78%; }
    .skel-line.w64 { width: 64%; }
    .skel-line.w48 { width: 48%; }

    /* optional image block on card 2 */
    .skel-media { height: 160px; width: 100%; border-radius: 8px; margin-top: 4px; }

    /* reaction pills */
    .skel-reactions { display: flex; gap: 8px; padding-top: 4px; }
    .skel-reaction { height: 28px; width: 52px; border-radius: 9999px; }

    /* right rail */
    .community { padding: 16px; }
    .community h2 {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink-muted);
      margin-bottom: 12px;
    }
    .community-list { display: flex; flex-direction: column; gap: 8px; }
    .community-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 8px;
    }
    .community-avatar { width: 32px; height: 32px; border-radius: 9999px; flex-shrink: 0; }
    .community-text { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .community-name { height: 10px; width: 70%; }
    .community-loc { height: 8px; width: 45%; }
    .view-all {
      margin-top: 12px;
      font-size: 14px; font-weight: 600;
      color: var(--brand-primary);
    }

    /* annotation strip */
    .badge {
      position: fixed;
      left: 16px; bottom: 16px;
      background: var(--ink-lead);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 9999px;
      box-shadow: var(--shadow-lift);
      z-index: 10;
      letter-spacing: 0.01em;
    }
    .badge span { opacity: 0.65; font-weight: 400; margin-left: 8px; }

    /* label callouts for the proposal */
    .callout {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      color: var(--brand-primary-pressed);
      background: #e8f3eb;
      border: 1px solid rgba(63, 126, 84, 0.35);
      padding: 4px 8px;
      border-radius: 9999px;
      white-space: nowrap;
      pointer-events: none;
    }

    .feed-wrap { position: relative; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      fofafu
    </div>
    <div class="nav-track" aria-hidden="true">
      <div class="nav-item active">⌂</div>
      <div class="nav-item">◎</div>
      <div class="nav-item">✉</div>
      <div class="nav-item">⌕</div>
      <div class="nav-item">▦</div>
    </div>
    <div class="nav-right">
      <div class="avatar-chip">J</div>
    </div>
  </header>

  <main>
    <div class="grid">
      <!-- left: family rail stays real (already loaded / local auth) -->
      <aside>
        <section class="card family-card">
          <div class="family-banner"></div>
          <div class="family-body">
            <div class="family-avatar">J</div>
            <div class="family-name">Jordan Lee</div>
            <div class="family-meta">Portland, OR</div>
            <div class="pill-btn">Edit family page</div>
          </div>
        </section>
      </aside>

      <!-- center: composer real + feed skeletons -->
      <section class="stack" aria-label="Announcements" aria-busy="true">
        <form class="card composer" onsubmit="return false;">
          <div class="composer-placeholder">What's going on at home?</div>
          <div class="composer-row">
            <div class="composer-tools"><div class="tool-chip"></div></div>
            <button class="post-btn" type="button">Post</button>
          </div>
        </form>

        <div class="feed-wrap">
          <!-- Card 1: text-only skeleton -->
          <article class="card skel-card" aria-hidden="true">
            <div class="skel-header">
              <div class="skel-author">
                <div class="bone bone-round skel-avatar"></div>
                <div class="skel-meta">
                  <div class="bone bone-round skel-name"></div>
                  <div class="bone bone-round skel-time"></div>
                </div>
              </div>
              <div class="bone bone-round skel-open"></div>
            </div>
            <div class="skel-lines">
              <div class="bone bone-round skel-line w100"></div>
              <div class="bone bone-round skel-line w92"></div>
              <div class="bone bone-round skel-line w64"></div>
            </div>
            <div class="skel-reactions">
              <div class="bone bone-round skel-reaction"></div>
              <div class="bone bone-round skel-reaction"></div>
              <div class="bone bone-round skel-reaction"></div>
            </div>
          </article>
        </div>

        <!-- Card 2: with media block -->
        <article class="card skel-card" aria-hidden="true">
          <div class="skel-header">
            <div class="skel-author">
              <div class="bone bone-round skel-avatar"></div>
              <div class="skel-meta">
                <div class="bone bone-round skel-name" style="width:112px"></div>
                <div class="bone bone-round skel-time"></div>
              </div>
            </div>
            <div class="bone bone-round skel-open"></div>
          </div>
          <div class="skel-lines">
            <div class="bone bone-round skel-line w92"></div>
            <div class="bone bone-round skel-line w78"></div>
          </div>
          <div class="bone skel-media"></div>
          <div class="skel-reactions">
            <div class="bone bone-round skel-reaction"></div>
            <div class="bone bone-round skel-reaction"></div>
            <div class="bone bone-round skel-reaction"></div>
          </div>
        </article>

        <!-- Card 3: short post -->
        <article class="card skel-card" aria-hidden="true">
          <div class="skel-header">
            <div class="skel-author">
              <div class="bone bone-round skel-avatar"></div>
              <div class="skel-meta">
                <div class="bone bone-round skel-name" style="width:80px"></div>
                <div class="bone bone-round skel-time"></div>
              </div>
            </div>
            <div class="bone bone-round skel-open"></div>
          </div>
          <div class="skel-lines">
            <div class="bone bone-round skel-line w100"></div>
            <div class="bone bone-round skel-line w48"></div>
          </div>
          <div class="skel-reactions">
            <div class="bone bone-round skel-reaction"></div>
            <div class="bone bone-round skel-reaction"></div>
          </div>
        </article>
      </section>

      <!-- right: community also skeletoned -->
      <aside>
        <section class="card community">
          <h2>Community</h2>
          <div class="community-list" aria-hidden="true">
            <div class="community-row">
              <div class="bone bone-round community-avatar"></div>
              <div class="community-text">
                <div class="bone bone-round community-name"></div>
                <div class="bone bone-round community-loc"></div>
              </div>
            </div>
            <div class="community-row">
              <div class="bone bone-round community-avatar"></div>
              <div class="community-text">
                <div class="bone bone-round community-name" style="width:55%"></div>
                <div class="bone bone-round community-loc" style="width:38%"></div>
              </div>
            </div>
            <div class="community-row">
              <div class="bone bone-round community-avatar"></div>
              <div class="community-text">
                <div class="bone bone-round community-name" style="width:80%"></div>
                <div class="bone bone-round community-loc" style="width:50%"></div>
              </div>
            </div>
            <div class="community-row">
              <div class="bone bone-round community-avatar"></div>
              <div class="community-text">
                <div class="bone bone-round community-name" style="width:62%"></div>
                <div class="bone bone-round community-loc" style="width:42%"></div>
              </div>
            </div>
            <div class="community-row">
              <div class="bone bone-round community-avatar"></div>
              <div class="community-text">
                <div class="bone bone-round community-name" style="width:74%"></div>
                <div class="bone bone-round community-loc" style="width:40%"></div>
              </div>
            </div>
          </div>
          <div class="view-all">View all →</div>
        </section>
      </aside>
    </div>
  </main>

  <div class="badge">Proposal mock <span>Home · feed skeleton while loading</span></div>
</body>
</html>
